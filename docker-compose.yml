services:
  auth-api:
    image: auth-api:1.0.0
    container_name: auth-api
    build: .
    env_file:
      - .env.dev
    ports:
      - "8010:8010"
    networks:
      - biofin_network
    restart: unless-stopped

  auth-db:
    image: postgres:16
    container_name: auth-db
    restart: unless-stopped
    env_file:
      - .env.dev
    ports:
      - "5433:5432"
    volumes:
      - auth_data:/var/lib/postgresql/data
    networks:
      - biofin_network


volumes:
  auth_data:

networks:
  biofin_network:
    external: true